[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coflow5-synapse"
version = "0.1.0"
description = "Reliable AI decision platform for urban traffic simulation"
requires-python = "==3.11.*"
dependencies = [
  "duckdb==1.3.2",
  "hypothesis==6.138.4",
  "pyarrow==21.0.0",
  "pydantic==2.11.7",
]

[project.optional-dependencies]
api = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "uvicorn[standard]==0.35.0",
]
# The live simulator imports SUMO at module level (traffix/api/live.py). Pinned to the SUMO
# binary version; sumo-data must match it or SUMO's data files and binary drift apart.
sim = [
  "eclipse-sumo==1.27.1",
  "sumo-data==1.27.1",
  "sumolib==1.27.1",
  "traci==1.27.1",
  "libsumo==1.27.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
